<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungian Dream Interpreter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --ink: #1b1f24;
        --muted: #5a6470;
        --paper: #f4efe9;
        --accent: #9a4d2b;
        --accent-2: #e8c39e;
        --shadow: rgba(22, 19, 17, 0.12);
      }

      body {
        font-family: "Manrope", sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 80% 10%, #fef8f1 0%, transparent 60%),
          radial-gradient(900px 500px at 10% 20%, #f3e1d2 0%, transparent 55%),
          linear-gradient(160deg, #f8f1e8 0%, #efe4d7 55%, #f2ece2 100%);
        min-height: 100vh;
      }

      .page-shell {
        padding: 48px 0 64px;
      }

      .title {
        font-family: "Fraunces", serif;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--muted);
        max-width: 640px;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        border-radius: 20px;
        box-shadow: 0 18px 60px var(--shadow);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      .dream-input {
        border-radius: 16px;
        border: 1px solid rgba(27, 31, 36, 0.15);
        padding: 14px 16px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .dream-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(154, 77, 43, 0.15);
      }

      .cta-btn {
        background: linear-gradient(135deg, var(--accent), #b5663b);
        border: none;
        border-radius: 999px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 12px 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cta-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(154, 77, 43, 0.25);
      }

      .result-card {
        border-radius: 18px;
        background: #fff;
        border: 1px solid rgba(27, 31, 36, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        animation: rise 0.5s ease-out both;
      }

      .result-text {
        text-align: left;
        line-height: 1.6;
        color: #2c3137;
      }

      .dream-image {
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        animation: fadeIn 0.7s ease-out both;
      }

      .status-badge {
        font-size: 0.9rem;
        color: var(--muted);
        background: rgba(232, 195, 158, 0.45);
        border-radius: 999px;
        padding: 6px 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(154, 77, 43, 0.6);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="container page-shell text-center">
      <div class="glass-card p-4 p-md-5 mx-auto col-lg-8">
        <h1 class="display-4 title mb-2">Jungian Dream Interpreter</h1>
        <p class="subtitle mx-auto">
          Explore the symbolic layers of your dream with Jungian archetypes and a cinematic visual.
        </p>
        <div class="status-badge mt-3">
          <span class="status-dot"></span>
          GPT-4o interpretation + Stability image
        </div>
        <form id="dreamForm" method="POST" class="mx-auto mt-4">
          <textarea
            id="dreamInput"
            name="prompt"
            rows="4"
            class="form-control dream-input"
            placeholder="Describe your dream..."
            required
          ></textarea>
          <div class="d-grid mt-3">
            <input type="submit" value="Interpret" class="btn cta-btn text-white" />
          </div>
        </form>
      </div>

      {% if result %}
      <div class="row justify-content-center align-items-stretch g-4 p-4">
        <div class="col-12 col-md-6">
          <div class="result-card h-100 p-4" style="overflow-y: auto; max-height: 520px;">
            <div class="result-text">
            {{ result[0]|safe }}
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
          {% if result[1] %}
          <img src="{{ result[1] }}" alt="Dream Visualization" class="img-fluid dream-image" style="max-height: 520px;">
          {% else %}
          <div class="result-card p-4">Image generation pending or unavailable</div>
          {% endif %}
        </div>
      </div>
      {% endif %}
    </div>

    <script>
      const form = document.getElementById("dreamForm");
      const textarea = document.getElementById("dreamInput");
      const submitButton = form.querySelector('input[type="submit"]');
      textarea.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (textarea.value.trim() !== "") {
            form.requestSubmit();
          }
        }
      });
      form.addEventListener("submit", function () {
        submitButton.value = "Interpreting...";
        submitButton.disabled = true;
      });
    </script>
  </body>
</html>
